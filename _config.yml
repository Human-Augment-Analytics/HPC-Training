title: HAAG HPC Training
description: A guided path from PACE ICE access to a verified first Slurm job.
url: https://human-augment-analytics.github.io
baseurl: /HPC-Training
markdown: kramdown
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
exclude:
  - .gitignore
  - README.md
  - LICENSE
  - site
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: ""
    values:
      layout: default
